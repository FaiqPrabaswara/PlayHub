
<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayHub - Tambah Game</title>

  <!-- Menghubungkan file CSS utama -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>PlayHub</h1>
    <p>Tambahkan game baru ke koleksi PlayHub.</p>

    <nav aria-label="Navigasi utama">
      <ul>
        <li><a href="index.html">Daftar Game</a></li>
        <li><a href="add-game.html" aria-current="page">Tambah Game</a></li>
        <li><a href="detail-game.html">Detail Minecraft</a></li>
        <li><a href="detail-valorant.html">Detail Valorant</a></li>
        <li><a href="detail-elden-ring.html">Detail Elden Ring</a></li>
      </ul>
    </nav>
  </header>

  <main class="add-game-main">
    <article class="add-game-card" aria-labelledby="tambah-game">
      <h2 id="tambah-game">Form Tambah Game</h2>
      <p>Isi data berikut untuk menambahkan game ke daftar PlayHub.</p>

      <img
        class="add-game-image"
        src="images/game-placeholder.svg"
        alt="Ilustrasi game baru"
        width="640"
        height="360"
      >

      <section aria-labelledby="data-game">
        <h3 id="data-game">Data Game</h3>

        <form action="index.html" method="get" class="add-game-form">
          <div class="form-group">
            <label for="nama-game">Nama Game</label>
            <input
              type="text"
              id="nama-game"
              name="nama-game"
              placeholder="Masukkan nama game"
              required
            >
          </div>

          <div class="form-group">
            <label for="genre">Genre</label>
            <select id="genre" name="genre" required>
              <option value="">Pilih genre</option>
              <option value="sandbox">Sandbox</option>
              <option value="fps">FPS</option>
              <option value="action-rpg">Action RPG</option>
            </select>
          </div>

          <div class="form-group">
            <label for="platform">Platform</label>
            <select id="platform" name="platform" required>
              <option value="">Pilih platform</option>
              <option value="pc">PC</option>
              <option value="konsol">Konsol</option>
              <option value="mobile">Mobile</option>
            </select>
          </div>

          <div class="form-group">
            <label for="developer">Developer</label>
            <input
              type="text"
              id="developer"
              name="developer"
              placeholder="Masukkan nama developer"
              required
            >
          </div>

          <div class="form-group">
            <label for="deskripsi">Deskripsi</label>
            <textarea
              id="deskripsi"
              name="deskripsi"
              rows="5"
              placeholder="Tuliskan deskripsi game"
              required
            ></textarea>
          </div>

          <button type="submit" class="add-game-button">
            Tambah Game
          </button>
        </form>
      </section>
    </article>
  </main>

  <footer>
    <p>&copy; 2026 PlayHub</p>
  </footer>
</body>
</html>
