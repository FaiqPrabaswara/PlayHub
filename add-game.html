<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayHub - Tambah Game</title>
</head>
<body>
  <header>
    <h1>PlayHub</h1>
    <p>Tambahkan game baru ke koleksi PlayHub.</p>
    <nav aria-label="Navigasi utama">
      <ul>
        <li><a href="index.html">Daftar Game</a></li>
        <li><a href="add-game.html" aria-current="page">Tambah Game</a></li>
        <li><a href="detail-game.html">Detail Minecraft</a></li>
        <li><a href="detail-valorant.html">Detail Valorant</a></li>
        <li><a href="detail-elden-ring.html">Detail Elden Ring</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <article aria-labelledby="tambah-game">
      <h2 id="tambah-game">Form Tambah Game</h2>
      <p>Isi data berikut untuk menambahkan game ke daftar PlayHub.</p>
      <img src="images/game-placeholder.svg" alt="Ilustrasi placeholder untuk game baru yang akan ditambahkan" width="640" height="360">

      <section aria-labelledby="data-game">
        <h3 id="data-game">Data Game</h3>
        <form action="index.html" method="get">
          <p>
            <label for="nama-game">Nama Game</label><br>
            <input type="text" id="nama-game" name="nama-game" required>
          </p>

          <p>
            <label for="genre">Genre</label><br>
            <select id="genre" name="genre" required>
              <option value="">Pilih genre</option>
              <option value="sandbox">Sandbox</option>
              <option value="fps">FPS</option>
              <option value="action-rpg">Action RPG</option>
            </select>
          </p>

          <p>
            <label for="platform">Platform</label><br>
            <select id="platform" name="platform" required>
              <option value="">Pilih platform</option>
              <option value="pc">PC</option>
              <option value="konsol">Konsol</option>
              <option value="mobile">Mobile</option>
            </select>
          </p>

          <p>
            <label for="developer">Developer</label><br>
            <input type="text" id="developer" name="developer" required>
          </p>

          <p>
            <label for="deskripsi">Deskripsi</label><br>
            <textarea id="deskripsi" name="deskripsi" rows="5" cols="40" required></textarea>
          </p>

          <p><input type="submit" value="Tambah Game"></p>
        </form>
      </section>
    </article>
  </main>

  <footer>
    <p>&copy; 2026 PlayHub</p>
  </footer>
</body>
</html>
